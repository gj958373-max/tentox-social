
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">
  <title>TENTOX | Social Access Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 18px;
      background: radial-gradient(circle at top, #10234a, #050816 55%);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #55d9ff;
      text-shadow: 0 0 22px #087cff;
    }
    .tagline {
      color: #9eabc8;
      font-size: 13px;
      letter-spacing: 3px;
      margin: 12px 0 30px;
    }
    .panel {
      background: rgba(13, 25, 52, .88);
      border: 1px solid #174d83;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 0 35px rgba(0, 145, 255, .13);
    }
    h2 { font-size: 20px; margin: 0 0 8px; }
    .description {
      color: #9eabc8;
      font-size: 13px;
      margin-bottom: 23px;
    }
    .link {
      display: block;
      text-decoration: none;
      color: white;
      background: #101f3d;
      border: 1px solid #24517c;
      border-radius: 12px;
      padding: 15px;
      margin: 11px 0;
      font-weight: bold;
      transition: .2s;
    }
    .link:hover {
      background: #123d68;
      border-color: #55d9ff;
      transform: translateY(-2px);
    }
    footer {
      margin-top: 22px;
      color: #7184a8;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">TENTOX</div>
    <div class="tagline">YOUR DIGITAL CONNECTION HUB</div>

    <section class="panel">
      <h2>Welcome to TENTOX</h2>
      <p class="description">Choose a platform to connect with the world.</p>

      <a class="link" href="https://www.instagram.com/">◎ Instagram</a>
      <a class="link" href="https://www.facebook.com/">f Facebook</a>
      <a class="link" href="https://x.com/">𝕏 Twitter / X</a>
      <a class="link" href="https://www.tiktok.com/">♪ TikTok</a>
      <a class="link" href="https://www.whatsapp.com/">✆ WhatsApp</a>
      <a class="link" href="https://imo.im/">◉ IMO</a>
      <a class="link" href="https://zangi.com/">◆ Zangi</a>
    </section>

    <footer>POWERED BY TENTOX SYSTEMS</footer>
  </main>
</body>
</html>
